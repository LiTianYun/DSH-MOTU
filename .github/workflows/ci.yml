name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` also runs the `prepare` script, which vendors the engine builds
      # from devDependencies — the same step a fresh clone needs.
      - run: npm ci
      - run: npm test
      - run: npm run check:renderers
      - run: npx playwright install --with-deps chromium
      - run: npm run check:ui
