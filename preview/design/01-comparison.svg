<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>两种缓存策略的对比</title>
<desc>左侧本地缓存三实例各存一份导致不一致，右侧共享 Redis 集群单一副本、统一失效。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="40" width="292" height="250" rx="16" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="66" y="70" font-size="14" font-weight="500" fill="#791F1F" dominant-baseline="central">本地缓存（现状）</text>
<rect x="60" y="92" width="252" height="44" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="0.5"/>
<text x="186" y="114" font-size="13" fill="#501313" text-anchor="middle" dominant-baseline="central">每个实例各存一份</text>
<path d="M186 136 V150" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M96 150 L276 150" fill="none" stroke="#A32D2D" stroke-width="1.5"/>
<path d="M102 150 V160" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="164" width="84" height="36" rx="8" fill="#FFFFFF" stroke="#F09595" stroke-width="0.5"/>
<text x="102" y="182" font-size="12" fill="#501313" text-anchor="middle" dominant-baseline="central">实例 A</text>
<path d="M194 150 V160" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="152" y="164" width="84" height="36" rx="8" fill="#FFFFFF" stroke="#F09595" stroke-width="0.5"/>
<text x="194" y="182" font-size="12" fill="#501313" text-anchor="middle" dominant-baseline="central">实例 B</text>
<path d="M286 150 V160" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="244" y="164" width="84" height="36" rx="8" fill="#FFFFFF" stroke="#F09595" stroke-width="0.5"/>
<text x="286" y="182" font-size="12" fill="#501313" text-anchor="middle" dominant-baseline="central">实例 C</text>
<text x="60" y="226" font-size="12" fill="#A32D2D" dominant-baseline="central">· 内存被 triple，命中率低</text>
<text x="60" y="250" font-size="12" fill="#A32D2D" dominant-baseline="central">· 一份失效，三份不一致</text>
<rect x="348" y="40" width="292" height="250" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="374" y="70" font-size="14" font-weight="500" fill="#085041" dominant-baseline="central">共享缓存（建议）</text>
<rect x="368" y="92" width="84" height="36" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="410" y="110" font-size="12" fill="#173404" text-anchor="middle" dominant-baseline="central">实例 A</text>
<path d="M410 128 V142" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="460" y="92" width="84" height="36" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="502" y="110" font-size="12" fill="#173404" text-anchor="middle" dominant-baseline="central">实例 B</text>
<path d="M502 128 V142" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="552" y="92" width="84" height="36" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="594" y="110" font-size="12" fill="#173404" text-anchor="middle" dominant-baseline="central">实例 C</text>
<path d="M594 128 V142" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M410 142 L578 142" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<path d="M494 142 V154" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="410" y="158" width="168" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="494" y="178" font-size="12" fill="#173404" text-anchor="middle" dominant-baseline="central">Redis 集群（单一副本）</text>
<text x="368" y="226" font-size="12" fill="#0F6E56" dominant-baseline="central">· 一份数据，全员命中</text>
<text x="368" y="250" font-size="12" fill="#0F6E56" dominant-baseline="central">· TTL 统一，失效一致</text>
</svg>
