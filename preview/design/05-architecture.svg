<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>Web 应用三层架构</title>
<desc>接入层、服务层、数据层自上而下，右侧琥珀色面板列出贯穿三层的横切关注点。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="40" width="460" height="108" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="64" y="70" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">接入层</text>
<rect x="180" y="70" width="92" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="226" y="94" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">API 网关</text>
<rect x="284" y="70" width="92" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="94" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">静态资源</text>
<rect x="388" y="70" width="92" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="434" y="94" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">限流熔断</text>
<path d="M270 148 V168" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="168" width="460" height="108" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="64" y="198" font-size="14" font-weight="500" fill="#085041" dominant-baseline="central">服务层</text>
<rect x="180" y="198" width="92" height="48" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="226" y="222" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">订单服务</text>
<rect x="284" y="198" width="92" height="48" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="222" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">库存服务</text>
<rect x="388" y="198" width="92" height="48" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="434" y="222" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">用户服务</text>
<path d="M270 276 V296" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="296" width="460" height="108" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="64" y="326" font-size="14" font-weight="500" fill="#444441" dominant-baseline="central">数据层</text>
<rect x="180" y="326" width="92" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="226" y="350" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">PostgreSQL</text>
<rect x="284" y="326" width="92" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="330" y="350" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Redis</text>
<rect x="388" y="326" width="92" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="434" y="350" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">对象存储</text>
<rect x="520" y="40" width="120" height="364" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="580" y="70" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">横切关注</text>
<rect x="536" y="92" width="88" height="40" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
<text x="580" y="112" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">日志</text>
<rect x="536" y="152" width="88" height="40" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
<text x="580" y="172" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">监控</text>
<rect x="536" y="212" width="88" height="40" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
<text x="580" y="232" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">鉴权</text>
<text x="580" y="300" font-size="11" fill="#BA7517" text-anchor="middle">每一层</text>
<text x="580" y="322" font-size="11" fill="#BA7517" text-anchor="middle">都要接</text>
</svg>
