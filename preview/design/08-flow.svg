<svg viewBox="0 0 680 300" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>支付流程决策</title>
<desc>发起支付后判断余额，充足走扣款出单，不足触发充值，最终汇流到通知结果。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="270" y="40" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="62" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">发起支付</text>
<path d="M340 84 V104" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<polygon points="340,104 400,144 340,184 280,144" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="140" font-size="12" fill="#444441" text-anchor="middle">余额</text>
<text x="340" y="160" font-size="12" fill="#444441" text-anchor="middle">充足？</text>
<path d="M400 144 H470" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<text x="435" y="136" font-size="11" fill="#0F6E56" text-anchor="middle">是</text>
<path d="M280 144 H210" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#a)"/>
<text x="245" y="136" font-size="11" fill="#A32D2D" text-anchor="middle">否</text>
<rect x="470" y="120" width="150" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="545" y="138" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">扣款 &amp; 出单</text>
<text x="545" y="156" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">幂等 · 可重试</text>
<rect x="60" y="120" width="150" height="48" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="135" y="138" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">触发充值</text>
<text x="135" y="156" font-size="11" fill="#BA7517" text-anchor="middle" dominant-baseline="central">拉起收银台</text>
<path d="M545 168 V210" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M135 168 V210" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M135 210 H470" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M340 210 V228" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="270" y="230" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="252" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">通知结果</text>
</svg>
