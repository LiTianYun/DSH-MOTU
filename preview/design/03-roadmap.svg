<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>工程师四级成长</title>
<desc>从独立完成需求到定义技术方向的四个层级，逐级上升，L4 为虚线远景。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="42" y="40" font-size="12" style="fill:var(--color-text-tertiary,#888780)">工程师成长 · 每级都能独立交付</text>
<path d="M42 400 L185 400 L185 340 L336 340 L336 280 L487 280 L487 220 L636 220" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<g>
<rect x="42" y="268" width="141" height="132" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="55" y="292" font-size="11" font-weight="500" fill="#185FA5">L1 · 入门</text>
<text x="55" y="320" font-size="14" font-weight="500" fill="#0C447C">独立完成需求</text>
<text x="55" y="352" font-size="12" fill="#185FA5">写测试 · 懂回滚</text>
<text x="55" y="374" font-size="12" fill="#185FA5">代码被 review 通过</text>
</g>
<g>
<rect x="193" y="210" width="141" height="132" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="206" y="234" font-size="11" font-weight="500" fill="#185FA5">L2 · 熟练</text>
<text x="206" y="262" font-size="14" font-weight="500" fill="#0C447C">独立负责模块</text>
<text x="206" y="294" font-size="12" fill="#185FA5">设计评审主导</text>
<text x="206" y="316" font-size="12" fill="#185FA5">带新人上手</text>
</g>
<g>
<rect x="344" y="152" width="141" height="132" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="357" y="176" font-size="11" font-weight="500" fill="#534AB7">L3 · 骨干</text>
<text x="357" y="204" font-size="14" font-weight="500" fill="#3C3489">跨团队定方案</text>
<text x="357" y="236" font-size="12" fill="#534AB7">权衡取舍写进 ADR</text>
<text x="357" y="258" font-size="12" fill="#534AB7">救火不救火场</text>
</g>
<g>
<rect x="495" y="94" width="141" height="132" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="508" y="118" font-size="11" font-weight="500" fill="#7F77DD">L4 · 专家</text>
<text x="508" y="146" font-size="14" font-weight="500" fill="#3C3489">定义技术方向</text>
<text x="508" y="178" font-size="12" fill="#534AB7">影响路线图</text>
<text x="508" y="200" font-size="12" fill="#534AB7">培养下一个 L4</text>
</g>
</svg>
