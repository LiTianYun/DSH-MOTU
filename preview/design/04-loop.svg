<svg viewBox="0 0 680 214" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>需求闭环 · 五环</title>
<desc>提出、评审、开发、验收、回顾五环流转，底部虚线表示回到起点形成闭环。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="42" y="34" font-size="14" font-weight="500" fill="#444441">需求闭环 · 五环</text>
<rect x="40" y="58" width="108" height="96" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="94" y="88" font-size="11" font-weight="500" fill="#185FA5" text-anchor="middle">第 1 环</text>
<text x="94" y="116" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">提出</text>
<text x="94" y="138" font-size="11" fill="#185FA5" text-anchor="middle">写清验收标准</text>
<text x="155.5" y="112" font-size="12" fill="#888780" text-anchor="middle">→</text>
<rect x="163" y="58" width="108" height="96" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="217" y="88" font-size="11" font-weight="500" fill="#185FA5" text-anchor="middle">第 2 环</text>
<text x="217" y="116" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">评审</text>
<text x="217" y="138" font-size="11" fill="#185FA5" text-anchor="middle">砍范围定边界</text>
<text x="278.5" y="112" font-size="12" fill="#888780" text-anchor="middle">→</text>
<rect x="286" y="58" width="108" height="96" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="88" font-size="11" font-weight="500" fill="#185FA5" text-anchor="middle">第 3 环</text>
<text x="340" y="116" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">开发</text>
<text x="340" y="138" font-size="11" fill="#185FA5" text-anchor="middle">小步提交可回滚</text>
<text x="401.5" y="112" font-size="12" fill="#888780" text-anchor="middle">→</text>
<rect x="409" y="58" width="108" height="96" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="463" y="88" font-size="11" font-weight="500" fill="#BA7517" text-anchor="middle">第 4 环</text>
<text x="463" y="116" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">验收</text>
<text x="463" y="138" font-size="11" fill="#BA7517" text-anchor="middle">对照标准逐项过</text>
<text x="524.5" y="112" font-size="12" fill="#888780" text-anchor="middle">→</text>
<rect x="532" y="58" width="108" height="96" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="586" y="88" font-size="11" font-weight="500" fill="#A32D2D" text-anchor="middle">第 5 环</text>
<text x="586" y="116" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle">回顾</text>
<text x="586" y="138" font-size="11" fill="#A32D2D" text-anchor="middle">沉淀进知识库</text>
<path d="M586 154 V176 H94 V152" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="340" y="198" font-size="11" text-anchor="middle" style="fill:var(--color-text-tertiary,#888780)">转起来，需求才不会在原地打转</text>
</svg>
