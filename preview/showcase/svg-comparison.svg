<svg viewBox="0 0 680 250" width="680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Microsoft YaHei', sans-serif" style="" height="250">
<title>单体与拆分的对照</title>
<desc>左侧单体应用改动牵一发动全身，右侧按边界拆分后各自独立发布。</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"></path>
</marker>
</defs>
<rect x="40" y="36" width="280" height="180" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"></rect>
<text x="60" y="64" font-size="11" font-weight="500" fill="#A32D2D">现状</text>
<text x="60" y="92" font-size="14" font-weight="500" fill="#791F1F">单体应用</text>
<rect x="60" y="108" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#F09595" stroke-width="0.5"></rect>
<text x="180" y="130" font-size="12" fill="#501313" text-anchor="middle">改一处要整体回归</text>
<rect x="60" y="154" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#F09595" stroke-width="0.5"></rect>
<text x="180" y="176" font-size="12" fill="#501313" text-anchor="middle">发布窗口互相排队</text>
<path d="M330 126 H370" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"></path>
<rect x="380" y="36" width="260" height="180" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="400" y="64" font-size="11" font-weight="500" fill="#0F6E56">建议</text>
<text x="400" y="92" font-size="14" font-weight="500" fill="#085041">按边界拆分</text>
<rect x="400" y="108" width="220" height="36" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="510" y="130" font-size="12" fill="#085041" text-anchor="middle">各服务独立发布</text>
<rect x="400" y="154" width="220" height="36" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="510" y="176" font-size="12" fill="#085041" text-anchor="middle">故障不外溢</text>
<text x="42" y="236" font-size="11" style="fill:var(--color-text-tertiary,#888780)">手写 SVG 无需专用图表语法，但结构、溢出与留白仍要自己检查</text>
</svg>